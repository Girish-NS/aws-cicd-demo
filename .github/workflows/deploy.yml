name: Deploy Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -e
          echo "Creating SSH directory..."
          mkdir -p "$HOME/.ssh"
          echo "Writing private key..."
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"
          echo "Checking EC2 host..."
          ssh-keyscan -T 10 -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          echo "SSH configuration completed."

      - name: Copy website to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            index.html \
            "$EC2_USER@$EC2_HOST:/tmp/index.html"

      - name: Deploy website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo cp /tmp/index.html /var/www/html/index.html && sudo chown ubuntu:ubuntu /var/www/html/index.html"